[package]
name = "death-note"
version = "0.3.0"
edition = "2024"
description = "Bloco de notas em abas, rápido e leve"
repository = "https://github.com/almdoug/death-note"
build = "build.rs"

[features]
default = ["glow"]
# Renderizador OpenGL (padrão) ou wgpu (DirectX 12 / Vulkan / Metal)
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard", "wayland", "x11"] }
egui_dock = { version = "0.22", features = ["serde"] }
raw-window-handle = "0.6"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
